# \u00d0\u009d\u00d0\u00b0\u00d1\u0081\u00d1\u0082\u00d1\u0080\u00d0\u00be\u00d0\u00b9\u00d0\u00ba\u00d0\u00b8 \u00d0\u00b2\u00d1\u0081\u00d1\u0082\u00d1\u0080\u00d0\u00be\u00d0\u00b5\u00d0\u00bd\u00d0\u00bd\u00d0\u00be\u00d0\u00b3\u00d0\u00be \u00d1\u0081\u00d0\u00b5\u00d1\u0080\u00d0\u00b2\u00d0\u00b5\u00d1\u0080\u00d0\u00b0 Tomcat
server.port=8080
server.servlet.context-path=/webk5

# \u00d0\u009d\u00d0\u00b0\u00d1\u0081\u00d1\u0082\u00d1\u0080\u00d0\u00be\u00d0\u00b9\u00d0\u00ba\u00d0\u00b8 \u00d0\u00bf\u00d0\u00be\u00d0\u00b4\u00d0\u00ba\u00d0\u00bb\u00d1\u008e\u00d1\u0087\u00d0\u00b5\u00d0\u00bd\u00d0\u00b8\u00d1\u008f \u00d0\u00ba PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/postgres?currentSchema=public
spring.datasource.username=postgres
spring.datasource.password=28032007
spring.datasource.driver-class-name=org.postgresql.Driver

# \u00d0\u009e\u00d1\u0082\u00d0\u00ba\u00d0\u00bb\u00d1\u008e\u00d1\u0087\u00d0\u00b0\u00d0\u00b5\u00d0\u00bc \u00d0\u00bb\u00d0\u00b8\u00d1\u0088\u00d0\u00bd\u00d0\u00b8\u00d0\u00b5 \u00d0\u00bb\u00d0\u00be\u00d0\u00b3\u00d0\u00b8 \u00d0\u00b4\u00d0\u00bb\u00d1\u008f \u00d1\u0087\u00d0\u00b8\u00d1\u0081\u00d1\u0082\u00d0\u00be\u00d1\u0082\u00d1\u008b \u00d0\u00ba\u00d0\u00be\u00d0\u00bd\u00d1\u0081\u00d0\u00be\u00d0\u00bb\u00d0\u00b8
spring.jpa.hibernate.ddl-auto=none

# \u0420\u0430\u0437\u0440\u0435\u0448\u0430\u0435\u043c Spring \u043e\u0442\u0434\u0430\u0432\u0430\u0442\u044c \u043a\u0430\u0440\u0442\u0438\u043d\u043a\u0438 \u0438\u0437 \u043f\u0430\u043f\u043a\u0438 uploads \u043f\u043e URL /uploads/**
spring.web.resources.static-locations=classpath:/static/,file:./uploads/

# \u0423\u0432\u0435\u043b\u0438\u0447\u0438\u0432\u0430\u0435\u043c \u043b\u0438\u043c\u0438\u0442 \u043d\u0430 \u0440\u0430\u0437\u043c\u0435\u0440 \u0444\u0430\u0439\u043b\u0430 (10 \u041c\u0411) \u0438 \u0437\u0430\u043f\u0440\u043e\u0441\u0430 (10 \u041c\u0411)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB